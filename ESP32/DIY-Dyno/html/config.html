

<div id="configuration">
    <div class="config-panel">
    <h2>Hardware Configuration</h2>
    <form id="configForm" action="/api/saveconfig" method="POST">
        <div class="config-container">
            <!-- System Settings -->
            <fieldset>
                <legend>System Settings&nbsp;&nbsp;&nbsp;<a class="wiki-link" href="https://github.com/DIY-Flow-Bench/DIY-Flow-Bench/wiki/Configuration#system-settings/" target="_blank">&#9432;</a></legend>
                <div class="input-group">
                    <label for="bSD_ENABLED">SD Card</label>
                    <select name='bSD_ENABLED' class='config-select'>
                        <option value='0' ~bSD_ENABLED_0~>Disabled</option>
                        <option value='1' ~bSD_ENABLED_1~>Enabled</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="iMIN_PRESS_PCT">Minimum Pressure Percent</label>
                    <input type="number" id="iMIN_PRESS_PCT" name="iMIN_PRESS_PCT" value="~iMIN_PRESS_PCT~">
                </div>
                <div class="input-group">
                    <label for="dPIPE_RAD_FT">Pipe Radius (ft)</label>
                    <input type="number" id="dPIPE_RAD_FT" name="dPIPE_RAD_FT" step="0.000001" value="~dPIPE_RAD_FT~">
                </div>
            </fieldset>

            <!-- Power Settings -->
            <fieldset>
                <legend>Power Settings&nbsp;&nbsp;&nbsp;<a class="wiki-link" href="https://github.com/DIY-Flow-Bench/DIY-Flow-Bench/wiki/Configuration#power-settings" target="_blank">&#9432;</a></legend>
                <div class="input-group">
                    <label for="bFIXED_3_3V">Fixed 3.3V Value</label>
                    <select name='bFIXED_3_3V' class='config-select'>
                        <option value='0' ~bFIXED_3_3V_0~>Disabled</option>
                        <option value='1' ~bFIXED_3_3V_1~>Enabled</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="dVCC_3V3_TRIM">3.3V Trim</label>
                    <input type="number" id="dVCC_3V3_TRIM" name="dVCC_3V3_TRIM" step="0.001" value="~dVCC_3V3_TRIM~">
                </div>
                <div class="input-group">
                    <label for="bFIXED_5V">Fixed 5V Value</label>
                    <select name='bFIXED_5V' class='config-select'>
                        <option value='0' ~bFIXED_5V_0~>Disabled</option>
                        <option value='1' ~bFIXED_5V_1~>Enabled</option>
                    </select>               
                 </div>
                 <div class="input-group">
                    <label for="dVCC_5V_TRIM">5V Trim</label>
                    <input type="number" id="dVCC_5V_TRIM" name="dVCC_5V_TRIM" step="0.001" value="~dVCC_5V_TRIM~">
                </div>
            </fieldset>

            <!-- BME Settings -->
            <fieldset>
                <legend>BME Settings&nbsp;&nbsp;&nbsp;<a class="wiki-link" href="https://github.com/DIY-Flow-Bench/DIY-Flow-Bench/wiki/Configuration#bme-settings" target="_blank">&#9432;</a></legend>
                <div class="input-group">
                    <label for="iBME_TYP">BME Type</label>
                    <select name='iBME_TYP' class='config-select'>
                        <option value='1' ~iBME_TYP_1~>Disabled</option>
                        <option value='7' ~iBME_TYP_7~>BME 280</option>
                        <option value='17' ~iBME_TYP_17~>BME 680</option>
                    </select>                    
                </div>
                <div class="input-group">
                    <label for="iBME_ADDR">I2C Address</label>
                    <input type="number" id="iBME_ADDR" name="iBME_ADDR" value="~iBME_ADDR~">
                </div>
            </fieldset>

            <!-- ADC Settings -->
            <fieldset>
                <legend>ADC Settings&nbsp;&nbsp;&nbsp;<a class="wiki-link" href="https://github.com/DIY-Flow-Bench/DIY-Flow-Bench/wiki/Configuration#adc-settings" target="_blank">&#9432;</a></legend>
                <div class="input-group">
                    <label for="iADC_TYPE">ADC Type</label>
                    <select name='iADC_TYPE' class='config-select'>
                        <option value='10' ~iADC_TYPE_10~>ADS1015</option>
                        <option value='11' ~iADC_TYPE_11~>ADS1115</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="iADC_I2C_ADDR">I2C Address</label>
                    <input type="number" id="iADC_I2C_ADDR" name="iADC_I2C_ADDR" value="~iADC_I2C_ADDR~">
                </div>
            </fieldset>

            <!-- RTC Settings -->
            <fieldset>
                <legend>RTC Settings&nbsp;&nbsp;&nbsp;</legend>
                <div class="input-group">
                    <label for="bRTC_ENABLED">RTC Support</label>
                    <select name='bRTC_ENABLED' class='config-select'>
                        <option value='0' ~bRTC_ENABLED_0~>Disabled</option>
                        <option value='1' ~bRTC_ENABLED_1~>Enabled</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="iRTC_I2C_ADDR">I2C Address</label>
                    <input type="number" id="iRTC_I2C_ADDR" name="iRTC_I2C_ADDR" value="~iRTC_I2C_ADDR~">
                </div>
                <div class="input-group">
                    <label>Status</label>
                    <span class="config-value" style="font-weight: bold;">~sRTC_STATUS~</span>
                </div>
                <hr class="fieldset-divider">
                <div class="input-group">
                    <label>Set Time Manually</label>
                    <button type="button" onclick="setManTime()" class="button-sml" style="padding: 4px 8px; margin-top: 4px;">Set to Computer Clock</button>
                </div>
            </fieldset>

            <!-- Load Cell Settings (HX711) -->
            <fieldset>
                <legend>Load Cell Settings (HX711)</legend>
                <div class="input-group">
                    <label for="dMAF_MV_TRIM">Calibration Scale Factor (counts/kg)</label>
                    <input type="number" id="dMAF_MV_TRIM" name="dMAF_MV_TRIM" step="0.001" value="~dMAF_MV_TRIM~">
                </div>
                <input type="hidden" name="iMAF_SENS_TYP" value="0">
                <input type="hidden" name="iMAF_SRC_TYP" value="12">
            </fieldset>

            <!-- Torque Arm Settings -->
            <fieldset>
                <legend>Torque Arm Settings</legend>
                <div class="input-group">
                    <label for="dPREF_MV_TRIM">Torque Arm Length (meters, e.g. 0.150)</label>
                    <input type="number" id="dPREF_MV_TRIM" name="dPREF_MV_TRIM" step="0.001" value="~dPREF_MV_TRIM~">
                </div>
                <input type="hidden" name="iPREF_SENS_TYP" value="3">
                <input type="hidden" name="iPREF_SRC_TYP" value="12">
            </fieldset>

            <!-- Legacy Pressure Sensors (Hidden for Dyno) -->
            <div style="display: none;">
                <input type="hidden" name="iPDIFF_SENS_TYP" value="1">
                <input type="hidden" name="dPDIFF_MV_TRIM" value="0.0">
                <input type="hidden" name="iPDIFF_SRC_TYP" value="12">
                <input type="hidden" name="iPITOT_SENS_TYP" value="1">
                <input type="hidden" name="dPITOT_MV_TRIM" value="0.0">
                <input type="hidden" name="iPITOT_SRC_TYP" value="12">
            </div>

            <!-- Barometric Settings -->
            <fieldset>
                <legend>Barometric Settings&nbsp;&nbsp;&nbsp;<a class="wiki-link" href="https://github.com/DIY-Flow-Bench/DIY-Flow-Bench/wiki/Configuration#barometric-settings" target="_blank">&#9432;</a></legend>
                <div class="input-group">
                    <label for="iBARO_SENS_TYP">Sensor Type</label>
                    <select name='iBARO_SENS_TYP' class='config-select-long'>
                        <option value='1' ~iBARO_SENS_TYP_1~>Disabled</option>
                        <option value='3' ~iBARO_SENS_TYP_3~>Fixed Value</option>
                        <option value='7' ~iBARO_SENS_TYP_7~>BME280</option>
                        <option value='12' ~iBARO_SENS_TYP_12~>Analog Pin</option>
                        <option value='17' ~iBARO_SENS_TYP_17~>BME680</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="dBARO_MV_TRIM">mV Trim</label>
                    <input type="number" id="dBARO_MV_TRIM" name="dBARO_MV_TRIM" step="0.001" value="~dBARO_MV_TRIM~">
                </div>
                <div class="input-group">
                    <label for="dBARO_FINE_TUNE">Fine Tune</label>
                    <input type="number" id="dBARO_FINE_TUNE" name="dBARO_FINE_TUNE" step="0.001" value="~dBARO_FINE_TUNE~">
                </div>
            </fieldset>

            <!-- Temperature Settings -->
            <fieldset>
                <legend>Temperature Settings&nbsp;&nbsp;&nbsp;<a class="wiki-link" href="https://github.com/DIY-Flow-Bench/DIY-Flow-Bench/wiki/Configuration#temperature-settings" target="_blank">&#9432;</a></legend>
                <div class="input-group">
                    <label for="iTEMP_SENS_TYP">Sensor Type</label>
                    <select name='iTEMP_SENS_TYP' class='config-select-long'>
                        <option value='1' ~iTEMP_SENS_TYP_1~>Disabled</option>
                        <option value='3' ~iTEMP_SENS_TYP_3~>Fixed Value</option>
                        <option value='7' ~iTEMP_SENS_TYP_7~>BME280</option>
                        <option value='12' ~iTEMP_SENS_TYP_12~>Analog Pin</option>
                        <option value='17' ~iTEMP_SENS_TYP_17~>BME680</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="dTEMP_MV_TRIM">mV Trim</label>
                    <input type="number" id="dTEMP_MV_TRIM" name="dTEMP_MV_TRIM" step="0.001" value="~dTEMP_MV_TRIM~">
                </div>
                <div class="input-group">
                    <label for="dTEMP_FINE_TUNE">Fine Tune</label>
                    <input type="number" id="dTEMP_FINE_TUNE" name="dTEMP_FINE_TUNE" step="0.001" value="~dTEMP_FINE_TUNE~">
                </div>
            </fieldset>

            <!-- Relative Humidity Settings -->
            <fieldset>
                <legend>Relative Humidity Settings&nbsp;&nbsp;&nbsp;<a class="wiki-link" href="https://github.com/DIY-Flow-Bench/DIY-Flow-Bench/wiki/Configuration#relative-humidity-settings" target="_blank">&#9432;</a></legend>
                <div class="input-group">
                    <label for="iRELH_SENS_TYP">Sensor Type</label>
                    <select name='iRELH_SENS_TYP' class='config-select-long'>
                        <option value='1' ~iRELH_SENS_TYP_1~>Disabled</option>
                        <option value='3' ~iRELH_SENS_TYP_3~>Fixed Value</option>
                        <option value='12' ~iRELH_SENS_TYP_12~>Analog Pin</option>
                        <option value='7' ~iRELH_SENS_TYP_7~>BME280</option>
                        <option value='17' ~iRELH_SENS_TYP_17~>BME680</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="dRELH_MV_TRIM">mV Trim</label>
                    <input type="number" id="dRELH_MV_TRIM" name="dRELH_MV_TRIM" step="0.001" value="~dRELH_MV_TRIM~">
                </div>
                <div class="input-group">
                    <label for="dRELH_FINE_TUNE">Fine Tune</label>
                    <input type="number" id="dRELH_FINE_TUNE" name="dRELH_FINE_TUNE" step="0.001" value="~dRELH_FINE_TUNE~">
                </div>
            </fieldset>

            <!-- Swirl Settings -->
            <fieldset>
                <legend>Swirl Settings&nbsp;&nbsp;&nbsp;<a class="wiki-link" href="https://github.com/DIY-Flow-Bench/DIY-Flow-Bench/wiki/Configuration#swirl-settings" target="_blank">&#9432;</a></legend>
                <div class="input-group">
                    <label for="bSWIRL_ENBLD">Enable Swirl</label>
                    <select name='bSWIRL_ENBLD' class='config-select'>
                        <option value='0' ~bSWIRL_ENBLD_0~>Disabled</option>
                        <option value='1' ~bSWIRL_ENBLD_1~>Enabled</option>
                    </select>                   
                </div>
            </fieldset>
        </div>
        <button type="submit" id="save-config-button" class="button">Save</button>
    </form>

    <script type="text/javascript" src="config.js"></script>
    <script type="text/javascript">
        function setManTime() {
            var now = new Date();
            var formData = new FormData();
            formData.append("year", now.getFullYear());
            formData.append("month", now.getMonth() + 1);
            formData.append("day", now.getDate());
            formData.append("hour", now.getHours());
            formData.append("minute", now.getMinutes());
            formData.append("second", now.getSeconds());
            
            fetch("/api/set_time", {
                method: "POST",
                body: formData
            }).then(function(res) {
                if (res.ok) {
                    alert("Local computer clock synchronized successfully on DIY-FB RTC!");
                    window.location.reload();
                } else {
                    alert("Error updating time.");
                }
            });
        }
    </script>
